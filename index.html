<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Nedvizhimosti</title>
    <!-- Podklyuchenie Tailwind CSS dlya bystrogo dizayna -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Shablon Shapki -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🏠 Nedvizhimosti.Ru</h1>
            <button onclick="openModal()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold shadow hover:bg-gray-100 transition">
                + Dobavit obyavlenie
            </button>
        </div>
    </header>

    <!-- Osnovnoy kontent -->
    <main class="container mx-auto px-4 py-8">
        <h2 class="text-xl font-semibold mb-6 text-gray-800">Aktualnye obyavleniya</h2>
        
        <!-- Setka dlya obyavleniy -->
        <div id="listingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Syuda budut dobavlyatsya kartochki cherez JavaScript -->
        </div>
    </main>

    <!-- Modalnoe okno dlya dobavleniya obyavleniya -->
    <div id="adModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center px-4">
        <div class="bg-white rounded-xl shadow-lg max-w-lg w-full p-6 relative">
            <h3 class="text-lg font-bold mb-4 text-gray-800">Novoe obyavlenie</h3>
            
            <form id="adForm" onsubmit="saveListing(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nazvanie obyavleniya</label>
                    <input type="text" id="title" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Naprimer: 2-komnatnaya kvartira">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tsena ($)</label>
                        <input type="number" id="price" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg" placeholder="50000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ploshchad (m²)</label>
                        <input type="number" id="area" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg" placeholder="45">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ssylka na foto</label>
                    <input type="url" id="image" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg" placeholder="https://images.unsplash.com/...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Opisanie</label>
                    <textarea id="description" rows="3" required class="w-full mt-1 p-2 border border-gray-300 rounded-lg" placeholder="Opishite preimushchestva..."></textarea>
                </div>
                
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400 transition">Otmena</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Opublikovat</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skript dlya logiki -->
    <script>
        // Zagruzka obyavleniy iz LocalStorage pri otkrytii sayta
        let listings = JSON.parse(localStorage.getItem('listings')) || [
            {
                title: "Sovremennaya studiya v tsentre",
                price: 45000,
                area: 32,
                image: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=600&q=80",
                description: "Utyuphennaya studiya posle remonta. Vsya mebel ostaetsya."
            }
        ];

        function renderListings() {
            const grid = document.getElementById('listingsGrid');
            grid.innerHTML = '';
            
            listings.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
                        <img src="${item.image}" alt="Foto" class="w-full h-48 object-cover">
                        <div class="p-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xl font-bold text-blue-600">$${item.price}</span>
                                <span class="text-sm text-gray-500">${item.area} m²</span>
                            </div>
                            <h3 class="font-bold text-lg text-gray-800 mb-1">${item.title}</h3>
                            <p class="text-gray-600 text-sm mb-4">${item.description}</p>
                            <button onclick="deleteListing(${index})" class="text-red-500 text-sm hover:underline"> Udalit</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal() {
            document.getElementById('adModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('adModal').classList.add('hidden');
            document.getElementById('adForm').reset();
        }

        function saveListing(event) {
            event.preventDefault();
            
            const newListing = {
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                area: document.getElementById('area').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value
            };

            listings.push(newListing);
            localStorage.setItem('listings', JSON.stringify(listings));
            
            renderListings();
            closeModal();
        }

        function deleteListing(index) {
            if(confirm('Vy uvereny, chto hochet udalit eto obyavlenie?')) {
                listings.splice(index, 1);
                localStorage.setItem('listings', JSON.stringify(listings));
                renderListings();
            }
        }

        // Pervonachalnyy vyzov
        renderListings();
    </script>
</body>
</html>
